plugins { id 'com.android.application' }

// Keep the existing local debug identity; never generate or bundle signing keys.
def debugKey = file(System.getenv('SQUARE_DRILLS_DEBUG_KEYSTORE') ?: new File(System.getProperty('user.home'), '.android/debug.keystore'))
if (!debugKey.isFile()) {
    throw new GradleException('An existing debug keystore is required. Set SQUARE_DRILLS_DEBUG_KEYSTORE to its location; no key has been created.')
}

android {
    namespace 'com.codeguy.squaredrills'
    compileSdk 36
    defaultConfig {
        applicationId 'com.codeguy.squaredrills'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        debug {
            storeFile debugKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
